name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
    - name: Install golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.64.8
        install-mode: binary
        # Args are passed to golangci-lint for actual linting, not for installation
        args: --timeout=5m
    - name: Build
      run: make build
    - name: Test
      run: make test
    - name: Test Race
      run: make test-race
    - name: Lint
      run: make lint
